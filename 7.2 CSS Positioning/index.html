<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */


      .blue-box{
      height: 300px;
      width: 500px;
      position: relative;
      left: 200px;
      top: 200px;
      background-color: blue;
    }


    .red-circle{
      height: 200px;
      width: 200px;
      position: absolute;
      left: 250px;
      top: 150px;
      background-color: red;
      border-radius: 50%;
    }

  

  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
